spring:
  datasource:
    url: jdbc:h2:mem:sports_lobby_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

app:
  security:
    rate-limit:
      enabled: false
  auth:
    otp:
      test-code-enabled: true
  files:
    local-storage-path: target/test-object-storage
