spring:
  application:
    name: sports-lobby-backend
  profiles:
    default: local
  datasource:
    url: ${SPORTS_LOBBY_DB_URL:jdbc:postgresql://localhost:5432/sports_lobby}
    username: ${SPORTS_LOBBY_DB_USER:sports_lobby}
    password: ${SPORTS_LOBBY_DB_PASSWORD:sports_lobby_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SPORTS_LOBBY_FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO

app:
  production:
    enabled: false
  demo-data:
    enabled: false
  api:
    request-id-header: X-Request-Id
  auth:
    access-token-secret: ${SPORTS_LOBBY_ACCESS_TOKEN_SECRET:dev-only-change-me-dev-only-change-me-32}
    access-token-ttl: ${SPORTS_LOBBY_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${SPORTS_LOBBY_REFRESH_TOKEN_TTL:30d}
    otp:
      ttl: ${SPORTS_LOBBY_OTP_TTL:5m}
      resend-cooldown: ${SPORTS_LOBBY_OTP_RESEND_COOLDOWN:60s}
      max-attempts: ${SPORTS_LOBBY_OTP_MAX_ATTEMPTS:5}
      test-code-enabled: true
    password-reset:
      ttl: ${SPORTS_LOBBY_PASSWORD_RESET_TTL:15m}
    google:
      enabled: ${SPORTS_LOBBY_GOOGLE_AUTH_ENABLED:false}
      client-id: ${SPORTS_LOBBY_GOOGLE_WEB_CLIENT_ID:}
  security:
    require-https: false
    rate-limit:
      enabled: ${SPORTS_LOBBY_RATE_LIMIT_ENABLED:true}
      max-tracked-keys: ${SPORTS_LOBBY_RATE_LIMIT_MAX_KEYS:100000}
  sms:
    twilio:
      enabled: false
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      api-key-secret: ${TWILIO_API_KEY_SECRET:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  admin:
    bootstrap:
      enabled: ${SPORTS_LOBBY_ADMIN_BOOTSTRAP_ENABLED:false}
      first-name: ${SPORTS_LOBBY_ADMIN_FIRST_NAME:Admin}
      last-name: ${SPORTS_LOBBY_ADMIN_LAST_NAME:User}
      email: ${SPORTS_LOBBY_ADMIN_EMAIL:}
      phone-e164: ${SPORTS_LOBBY_ADMIN_PHONE_E164:}
      password: ${SPORTS_LOBBY_ADMIN_PASSWORD:}
  files:
    provider: local
    bucket: ${SPORTS_LOBBY_FILES_BUCKET:sports-lobby-dev}
    vendor-verification-prefix: ${SPORTS_LOBBY_VENDOR_VERIFICATION_PREFIX:vendor-verification}
    court-images-prefix: ${SPORTS_LOBBY_COURT_IMAGES_PREFIX:court-images}
    signed-upload-ttl: ${SPORTS_LOBBY_SIGNED_UPLOAD_TTL:10m}
    signed-download-ttl: ${SPORTS_LOBBY_SIGNED_DOWNLOAD_TTL:5m}
    max-vendor-verification-document-bytes: ${SPORTS_LOBBY_VENDOR_DOC_MAX_BYTES:5242880}
    max-court-image-bytes: ${SPORTS_LOBBY_COURT_IMAGE_MAX_BYTES:5242880}
    local-base-url: ${SPORTS_LOBBY_LOCAL_FILE_BASE_URL:http://localhost:8080}
    local-storage-path: ${SPORTS_LOBBY_LOCAL_FILE_STORAGE_PATH:.local-object-storage}
    s3:
      region: ${AWS_REGION:us-east-1}
      endpoint: ${SPORTS_LOBBY_S3_ENDPOINT:}
      path-style-access: ${SPORTS_LOBBY_S3_PATH_STYLE:false}
