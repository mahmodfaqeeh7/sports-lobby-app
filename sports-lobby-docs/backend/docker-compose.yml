services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sports_lobby
      POSTGRES_USER: sports_lobby
      POSTGRES_PASSWORD: sports_lobby_dev
    ports:
      - "5432:5432"
    volumes:
      - sports_lobby_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_lobby -d sports_lobby"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sports_lobby_postgres:
